# Builds the iOS client and uploads it to TestFlight for internal testing.
#
# ## Why the triggers are what they are
#
# Not `push: branches: [ios]`. Every upload consumes a build number and lands in front of the
# testers, and `ios` takes tens of commits on a busy day - which would be tens of TestFlight builds,
# each on its own 90 day expiry clock. A tag or a button press says "this one is for testers", which
# is the thing a branch push does not say. Adding `branches: [ios]` here is a one line change if the
# cadence turns out to be wrong.
#
# Never `pull_request_target`: it runs with repository secrets available to code the pull request
# controls, which is how signing keys leak out of public repositories.
#
# ## What has to exist before this can work
#
#  - the identifiers `com.rscgit.aapsclient`, `com.rscgit.aapsclient2` and (2026-10-30) `com.rscgit.aaps`, the
#    master on the Virtual pump, each with its `.LiveActivity` id and `group.<id>` App Group, registered to the team
#    (not `app.aaps.client*`: those belong to the upstream team's TestFlight. The app picks its flavour
#    from the end of the id - see `clientFlavorFor` - so any id ending `client` / `client2` works)
#  - an app record in App Store Connect for each of the three
#  - an Internal Testing group with the testers in it
#  - the four values below, in an environment called `testflight`
#  - one Apple Distribution certificate, as two more secrets in the same environment (2026-10-15):
#    IOS_DISTRIBUTION_P12 (the .p12 file, base64) and IOS_DISTRIBUTION_P12_PASSWORD. Before this, every run
#    let Xcode create a NEW certificate on the blank runner, until the account hit Apple's certificate limit
#    and every archive failed with "Your account has reached the maximum number of certificates".
#    How to make the .p12 without a Mac: see `_docs/ios_signing_certificate.md`.
#
# The API key needs the **App Manager** role. A Developer role key uploads but may not create
# signing certificates, which is what `-allowProvisioningUpdates` asks it to do, and the failure
# reads as a signing error rather than a permissions one.

name: iOS TestFlight

on:
  # 2026-11-05, per explicit request: start it from a branch (Run workflow, or `gh workflow run`) to keep the Gradle cache. A
  # cache saved by a tag run can only be read by that same tag, so every tag run compiled everything again; runs from one
  # branch reuse each other's cache. The two options do what `skiptests` / `client1` in a tag name do. Tags still work.
  workflow_dispatch:
    inputs:
      skiptests:
        description: Skip the 30 minute iOS shell tests
        type: boolean
        default: true
      client1:
        description: Also build AAPSClient (Client1), about 3 hours more
        type: boolean
        default: false
  push:
    tags:
      - 'ios-testflight-*'

# Read-only: this job publishes to Apple, and needs nothing back from GitHub.
permissions:
  contents: read

concurrency:
  # Two uploads racing would take the same build number from the clock and the second would be
  # rejected. Never cancel a run in progress - it may already have uploaded.
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    # Forks have no signing identity and must not run this, even if they somehow held the secrets.
    if: github.repository == 'nightscout/AndroidAPS' || github.repository == 'RSC-RJCgit/AndroidAPS-kmp-aisf321'
    # 2026-11-05, per explicit request: the Intel runner, 4 cores and 14 GB (free, like macos-latest). macos-latest has 3 cores and
    # 7 GB, too little for the Release framework link: run 41998384938 died in it with "Java heap space" (DevirtualizationAnalysis),
    # and runs that got through spent about 2.5 hours there, short of memory. Kotlin/Native builds the iPhone framework on Intel too.
    runs-on: macos-15-intel
    # 2026-10-10: was 90. The first run on RSC-RJCgit/AndroidAPS-kmp-aisf321 passed its tests in about 30 minutes, then the Archive step
    # (the Kotlin/Native device build) was still compiling when the 90 minute limit cancelled it, 65 minutes in.
    timeout-minutes: 360   # the hosted-runner maximum; see the note above

    # One job, both clients (was a matrix of two jobs). The Archive step builds the whole Kotlin framework for the device in Release,
    # which is the long step (well over an hour), and both apps use the SAME framework. As two matrix jobs each runner built it from
    # scratch; here the second archive finds Gradle's outputs already built. A failure in the first app does not stop the second.
    # A tag name containing `skiptests` (for example ios-testflight-beta1c-skiptests) skips the 30 minute test step.
    # 2026-11-04: AAPSClient (Client1) is skipped unless the tag name contains `client1` (for example
    # ios-testflight-x-client1). Run #88 spent 3 h 18 m on its archive and then ran out of the 6 hour limit before the
    # AAPS master; by default only AAPSClient2 and AAPS are built, and AAPS reuses AAPSClient2's Kotlin build.

    # Holds the four secrets. Give it required reviewers and restrict it to the `ios` branch: in a
    # public repository that approval is the thing standing between a workflow edit and the signing
    # key.
    environment: testflight

    steps:
      - uses: actions/checkout@v5
        with:
          # The About dialog's build stamp comes from `git describe`; a depth 1 clone has no tags to
          # describe against.
          fetch-depth: 0

      # First, before the tests and the Kotlin/Native build, because everything after this needs the
      # credentials and none of it says so. The first run of this workflow spent 114 minutes building
      # and then failed inside `xcodebuild` with a bare "exit code 64" - a usage error, because an
      # empty `-authenticationKeyID` is a malformed argument rather than a missing secret. Nothing
      # before it complained: writing an empty key file and an empty team id both succeed.
      #
      # Only emptiness is checked, never a value, so nothing about a secret can reach the log.
      - name: Check the signing secrets are present
        env:
          KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          P12: ${{ secrets.IOS_DISTRIBUTION_P12 }}
          P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEY" ]           || missing="$missing APP_STORE_CONNECT_PRIVATE_KEY"
          [ -n "$KEY_ID" ]        || missing="$missing APP_STORE_CONNECT_KEY_ID"
          [ -n "$ISSUER_ID" ]     || missing="$missing APP_STORE_CONNECT_ISSUER_ID"
          [ -n "$APPLE_TEAM_ID" ] || missing="$missing APPLE_TEAM_ID"
          [ -n "$P12" ]           || missing="$missing IOS_DISTRIBUTION_P12"
          [ -n "$P12_PASSWORD" ]  || missing="$missing IOS_DISTRIBUTION_P12_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets in the 'testflight' environment:$missing"
            echo "Set them on the environment, not the repository, or this job cannot see them."
            exit 1
          fi
          echo "All six signing secrets are present."

      # 2026-11-13, per explicit request: stop here, in seconds, when Apple wants a new or updated agreement accepted. Run
      # #129 built for about 75 minutes and only then had both uploads refused with 403 REQUIRED_AGREEMENTS_MISSING_OR_EXPIRED.
      # The run signs in with the API key, so nobody sees the banner Apple shows on its web pages. Two small reads with the
      # same key: bundle ids (the signing side the export uses) and apps (App Store Connect). Only the agreement answer
      # stops the run; any other problem (network, key) is a warning, and the later steps report it as before.
      - name: Check the Apple agreements are accepted
        env:
          KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          # Fail-safe: only exit 3 (Apple's agreement answer) stops the run. Anything else, a Ruby error in this script
          # included, is a warning, so this check can never stop a good build by itself.
          rc=0
          ruby <<'RUBY' || rc=$?
          require "openssl"
          require "base64"
          require "json"
          require "net/http"

          b64 = ->(s) { Base64.urlsafe_encode64(s, padding: false) }
          begin
            key = OpenSSL::PKey.read(ENV.fetch("KEY"))   # the .p8 is a PKCS#8 "BEGIN PRIVATE KEY" EC key
            now = Time.now.to_i
            input = b64.(JSON.generate(alg: "ES256", kid: ENV.fetch("KEY_ID"), typ: "JWT")) + "." +
                    b64.(JSON.generate(iss: ENV.fetch("ISSUER_ID"), iat: now, exp: now + 300, aud: "appstoreconnect-v1"))
            # ES256 wants the raw 64 byte r|s, not the DER signature OpenSSL gives.
            der = key.sign(OpenSSL::Digest.new("SHA256"), input)
            raw = OpenSSL::ASN1.decode(der).value.map { |i| i.value.to_s(2).rjust(32, "\0".b) }.join
            jwt = "#{input}.#{b64.(raw)}"
          rescue => e
            puts "::warning::Could not make an App Store Connect token (#{e.class}), so the agreements were not checked"
            exit 0
          end

          answered = 0
          %w[/v1/bundleIds?limit=1 /v1/apps?limit=1].each do |path|
            uri = URI("https://api.appstoreconnect.apple.com#{path}")
            begin
              res = Net::HTTP.start(uri.host, uri.port, use_ssl: true, open_timeout: 20, read_timeout: 30) do |http|
                http.get(uri.request_uri, "Authorization" => "Bearer #{jwt}")
              end
            rescue => e
              puts "::warning::#{path}: no answer from Apple (#{e.class}), agreements not checked"
              next
            end
            body = res.body.to_s
            if res.code != "200" && body.include?("AGREEMENT")
              puts "::error::Apple wants an agreement accepted before it takes an upload. Sign in as the Account Holder at " \
                   "developer.apple.com/account (banner at the top) and appstoreconnect.apple.com > Business, accept every " \
                   "pending agreement, then run this again."
              exit 3
            elsif res.code == "200"
              puts "#{path}: OK"
              answered += 1
            else
              titles = (JSON.parse(body)["errors"] || []).map { |e| "#{e["code"]}: #{e["title"]}" }.join("; ") rescue ""
              puts "::warning::#{path}: HTTP #{res.code} #{titles}"
            end
          end
          puts(answered > 0 ? "No pending Apple agreement found." : "Agreements not checked (see the warnings above). The build goes on.")
          RUBY
          if [ "$rc" -eq 3 ]; then exit 1; fi
          if [ "$rc" -ne 0 ]; then echo "::warning::The agreement check itself failed (exit $rc), so it was skipped. The build goes on."; fi

      # 2026-11-05, per explicit request: Apple only takes uploads built with the iOS 26 SDK (Xcode 26). The Intel image defaults to an
      # older Xcode (run 42009728362: "built with the iOS 18.5 SDK", both uploads refused), with Xcode 26 installed beside it. Picks
      # the newest non-beta Xcode 26 and stops here, before the long build, if there is none.
      - name: Use the newest Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "::error::No Xcode 26 on this runner. Installed: $(ls -d /Applications/Xcode*.app 2>/dev/null | tr '\n' ' ')"
            exit 1
          fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos

      - name: Load jdk version
        run: |
          JAVA_VERSION=$(jq -r '.default' .github/jdk-map.json)
          echo "JAVA_VERSION=$JAVA_VERSION" >> $GITHUB_ENV

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      # In place of setup-java's `cache: gradle`, which saved one copy per tag and never updated it. This saves the Gradle home,
      # its build cache included, at the end of every branch run; a tag run only reads (from main), as its copy could not be
      # reused anyway and the repository's 10 GB cache space was full of them.
      - name: Set up Gradle with its cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref_type == 'tag' }}

      # 2026-11-05, per explicit request: fit Gradle to this runner (4 cores, 14 GB). The Release framework link needs a big heap (it ran
      # out at the project's 8 GB), so 10 GB in one JVM (the Kotlin compiler in-process, no separate 4 GB daemon), leaving about 4 GB
      # for the system and the linker's native (LLVM) memory. The Gradle user-home file below wins over the project's
      # gradle.properties, on this runner only.
      - name: Fit Gradle to the runner's memory
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'PROPS'
          org.gradle.jvmargs=-Xmx10g -XX:+UseParallelGC -Xss4m
          org.gradle.workers.max=4
          kotlin.compiler.execution.strategy=in-process
          PROPS
          echo "Runner: $(sysctl -n hw.ncpu) cores, $(( $(sysctl -n hw.memsize) / 1073741824 )) GB"

      # One line a minute with swap in use and memory pressure, so a run shows whether memory was the bottleneck. Summed up in
      # "Memory summary" near the end and kept with the logs.
      - name: Start the memory log
        run: |
          nohup bash -c 'while true; do echo "$(date -u +%H:%M:%S) $(sysctl -n vm.swapusage) | $(memory_pressure -Q 2>/dev/null | tail -1)"; sleep 60; done' > "$GITHUB_WORKSPACE/memory.log" 2>&1 &

      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          # runner.arch too: the Intel runner needs the x64 toolchain, not the arm64 one saved by earlier runs.
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-${{ runner.arch }}-

      # Runs the eleven `:ios:shell` tests, which no other job does - see `_docs/ios_blockers.md`.
      # They are here rather than nowhere because this is the workflow that hands a build to people:
      # `GuardedByTest` is what keeps a protected action from running without a prompt, and shipping
      # that untested to testers is worse than shipping it untested to a simulator.
      - name: Test the iOS shell
        if: ${{ !contains(github.ref_name, 'skiptests') && inputs.skiptests != true }}
        run: |
          set -o pipefail
          ./gradlew --console=plain --no-daemon \
            :ios:shell:iosSimulatorArm64Test :implementation:iosSimulatorArm64Test | tee ios-test.log

      # The task reports SKIPPED off macOS and the build still succeeds, so a green run proves
      # nothing on its own. Fail loudly if these ever stop executing here.
      - name: Assert the iOS tests really ran
        if: ${{ !contains(github.ref_name, 'skiptests') && inputs.skiptests != true }}
        run: |
          if grep -qE '^> Task :ios:shell:iosSimulatorArm64Test (SKIPPED|NO-SOURCE)' ios-test.log; then
            echo "::error::iOS shell tests were skipped - this job is not testing anything."
            exit 1
          fi
          test -d ios/shell/build/test-results/iosSimulatorArm64Test || {
            echo "::error::No iOS shell test results were produced."
            exit 1
          }

      # Writes AAPS_MARKETING_VERSION and AAPS_BUILD_NUMBER into ios/app/Version.xcconfig. The build
      # number is minutes since a fixed epoch: App Store Connect rejects a build number that is not
      # higher than the last one uploaded for the same marketing version.
      - name: Generate the version numbers
        run: ./gradlew --console=plain --no-daemon :ios:shell:generateIosVersionXcconfig

      - name: Provide the team id
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: echo "DEVELOPMENT_TEAM = $APPLE_TEAM_ID" > ios/app/Signing.local.xcconfig

      - name: Write the App Store Connect API key
        env:
          KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$KEY" > "$RUNNER_TEMP/keys/AuthKey_${KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/keys/AuthKey_${KEY_ID}.p8"

      # The one distribution certificate, into a keychain that only lives for this run. The export steps sign with it and
      # only fetch provisioning profiles (which have no limit); without it Xcode made a new certificate on every run.
      - name: Import the distribution certificate
        id: signing_setup
        env:
          P12: ${{ secrets.IOS_DISTRIBUTION_P12 }}
          P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/distribution.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/distribution.p12"
          # Fail here, not an hour later in the archive, when the file or its password is wrong.
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Apple Distribution" || {
            echo "::error::No 'Apple Distribution' identity in IOS_DISTRIBUTION_P12. Check the file and its password."
            exit 1
          }
          echo "Distribution certificate imported."

      - name: Archive AAPSClient
        id: archive1
        if: ${{ contains(github.ref_name, 'client1') || inputs.client1 == true }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          # 2026-10-17: the archive is NOT signed. Signing it needs an Apple Development certificate, and on a blank
          # runner Xcode made a new one every run (the certificate limit). Forcing "Apple Distribution" here instead
          # (15 Oct) failed: the project uses automatic signing, and Xcode refuses that mix. The export step below
          # signs once, with the distribution certificate from the keychain. DEVELOPMENT_TEAM on the command line
          # also reaches the Swift packages (Starscream), which do not read Signing.local.xcconfig.
          xcodebuild -project ios/app/AAPSClient.xcodeproj \
            -scheme AAPSClient \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/AAPSClient.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            archive | tee archive-AAPSClient.log
          # The BG widget reads the app's newest value through an App Group, which an unsigned archive does not carry
          bash .github/scripts/ios-add-app-group.sh "$RUNNER_TEMP/AAPSClient.xcarchive"

      - name: Export and upload AAPSClient to TestFlight
        if: ${{ !cancelled() && steps.archive1.outcome == 'success' }}
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          # `destination: upload` makes this step do the upload itself, so no separate altool call.
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/AAPSClient.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export-AAPSClient" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" | tee export-AAPSClient.log

      - name: Archive AAPSClient2
        id: archive2
        if: ${{ !cancelled() && steps.signing_setup.outcome == 'success' }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          # Not signed, the same as AAPSClient above: the export step signs.
          xcodebuild -project ios/app/AAPSClient.xcodeproj \
            -scheme AAPSClient2 \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/AAPSClient2.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            archive | tee archive-AAPSClient2.log
          bash .github/scripts/ios-add-app-group.sh "$RUNNER_TEMP/AAPSClient2.xcarchive"

      # Only when its own archive worked: otherwise this failed too, with a misleading "archive not found".
      - name: Export and upload AAPSClient2 to TestFlight
        if: ${{ !cancelled() && steps.archive2.outcome == 'success' }}
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          # `destination: upload` makes this step do the upload itself, so no separate altool call.
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/AAPSClient2.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export-AAPSClient2" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" | tee export-AAPSClient2.log

      - name: Archive AAPS
        id: archive3
        if: ${{ !cancelled() && steps.signing_setup.outcome == 'success' }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          # The AAPS master (Virtual pump, 2026-10-30). Not signed, the same as AAPSClient above: the export step signs.
          xcodebuild -project ios/app/AAPSClient.xcodeproj \
            -scheme AAPS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/AAPS.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            archive | tee archive-AAPS.log
          bash .github/scripts/ios-add-app-group.sh "$RUNNER_TEMP/AAPS.xcarchive"

      # Only when its own archive worked: otherwise this failed too, with a misleading "archive not found".
      - name: Export and upload AAPS to TestFlight
        if: ${{ !cancelled() && steps.archive3.outcome == 'success' }}
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          # `destination: upload` makes this step do the upload itself, so no separate altool call.
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/AAPS.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export-AAPS" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" | tee export-AAPS.log

      # A crash report is a list of hex addresses without this. Crashlytics can only put names to
      # them with the dSYM that belongs to this exact binary, and nobody else will ever have it -
      # a self-builder's dSYM stays on their machine. The Kotlin framework is linked statically, so
      # its DWARF is folded into the app's own dSYM and this one upload covers the shared code too.
      #
      # After the upload to TestFlight rather than before it: a symbol problem must never stop a
      # finished, signed build from reaching testers. The job still turns red, so nothing is hidden.
      #
      # Not the Crashlytics `run` build phase: it uploads detached and discards its errors, so a
      # broken upload looks like a green build. Not `uploadSymbols` in ExportOptions either - that
      # only covers the symbols inside the App Store package, which is a different thing.
      - name: Upload the debug symbols to Crashlytics
        run: |
          set -euo pipefail
          PLIST="ios/app/${{ matrix.scheme }}/GoogleService-Info.plist"
          UPLOAD="$RUNNER_TEMP/spm/checkouts/firebase-ios-sdk/Crashlytics/upload-symbols"
          DSYMS="$RUNNER_TEMP/${{ matrix.scheme }}.xcarchive/dSYMs"
          # The same rule the build itself follows: no config means no reporting, never no build.
          if [ ! -f "$PLIST" ]; then
            echo "::warning::no $PLIST, so this build has no crash reporting and nothing to symbolicate"
            exit 0
          fi
          if [ ! -x "$UPLOAD" ]; then
            echo "::error::upload-symbols is not at $UPLOAD - the SwiftPM checkout layout changed"
            exit 1
          fi
          if [ ! -d "$DSYMS" ]; then
            echo "::error::the archive has no dSYMs folder at $DSYMS"
            exit 1
          fi
          # Counted first on purpose. upload-symbols exits 0 when it finds nothing to do, so without
          # this the step could stay green while doing the one thing it exists to prevent.
          FOUND=$(find "$DSYMS" -maxdepth 1 -name '*.dSYM' | wc -l | tr -d ' ')
          if [ "$FOUND" -eq 0 ]; then
            echo "::error::the archive carries no dSYM - check DEBUG_INFORMATION_FORMAT for Release"
            exit 1
          fi
          echo "uploading $FOUND dSYM bundle(s) from $DSYMS"
          "$UPLOAD" -gsp "$PLIST" -p ios "$DSYMS" 2>&1 | tee upload-symbols.log
          # Matched against what upload-symbols really prints, read out of the binary itself. It
          # treats an empty dSYM and a failed submission as warnings and still exits 0, so the exit
          # code alone would let a build ship that nobody can read a crash from.
          #
          # "does not contain DWARF content" is deliberately NOT one of these: it is printed while
          # walking the folder, for sibling bundles, and the upload then succeeds anyway.
          if grep -qE "without any symbols|Could not complete submission|Failed to submit cSYM" upload-symbols.log; then
            echo "::error::upload-symbols could not take a dSYM, so this build cannot be symbolicated"
            exit 1
          fi
          # And say so positively, rather than trusting the absence of a complaint.
          if ! grep -q "Successfully submitted symbols" upload-symbols.log; then
            echo "::error::upload-symbols reported no successful submission, so nothing was uploaded"
            exit 1
          fi

      - name: Memory summary
        if: always()
        run: |
          [ -f memory.log ] || { echo "no memory log"; exit 0; }
          # vm.swapusage reads "total = 2048.00M  used = 1234.56M  free = ...".
          awk '{ for (i = 1; i < NF; i++) if ($i == "used") { v = $(i + 2); sub(/M/, "", v); if (v + 0 > max) { max = v + 0; at = $1 } } }
               END { printf "Peak swap in use: %.0f MB at %s UTC\n", max, at }' memory.log
          tail -n 3 memory.log

      # The key is a credential with upload rights; do not leave it on a runner that may be reused.
      - name: Remove the API key and the signing keychain
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/keys"
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-testflight-logs
          path: |
            ios-test.log
            archive-AAPSClient.log
            export-AAPSClient.log
            archive-AAPSClient2.log
            export-AAPSClient2.log
            archive-AAPS.log
            export-AAPS.log
            memory.log
          retention-days: 7
